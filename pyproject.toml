[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "transkribus-to-prima"
description = "A tool to convert Transkribus PAGE XML to valid PRIMA PAGE XML"
version = "0.0.2"
requires-python = ">=3.10"
authors = [{name = "kba"}, {name = "bertsky"}]
license = "Apache-2.0"
dependencies = ["lxml", "click"]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/kba/transkribus-to-prima"

[project.scripts]
transkribus-to-prima = "transkribus_to_prima.cli:cli"
page-fix-coordinates = "transkribus_to_prima.cli_coordinate_fixer:cli"
page-dimensions-from-image = "transkribus_to_prima.set_dimensions_from_image:cli"

[tool.setuptools]
packages = ["transkribus_to_prima"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.xsd"]
